name: Build Portable Pybin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            uv_platform: x86_64-unknown-linux-musl
          - runner: macos-latest
            triple: aarch64-apple-darwin
          - runner: macos-latest
            triple: x86_64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup environment
        run: ./setup.sh --env-only
        env:
          UV_PYTHON_PLATFORM: ${{ matrix.uv_platform }}

      - name: Package
        run: |
          mkdir -p pkg/pybin && \
          tar c --exclude='.git' --exclude='.github' --exclude='__pycache__' --exclude='build' --exclude='./pkg' --exclude='.DS_Store' . | tar x -C pkg/pybin && \
          tar czf "pybin-${{ matrix.triple }}.tar.gz" -C pkg pybin && \
          rm -rf pkg

      - uses: actions/upload-artifact@v4
        with:
          name: pybin-${{ matrix.triple }}
          path: pybin-${{ matrix.triple }}.tar.gz

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pybin-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: pybin-*.tar.gz
