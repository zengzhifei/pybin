name: Build Portable Pybin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - runner: macos-13
            triple: x86_64-apple-darwin
          - runner: macos-latest
            triple: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup environment
        run: ./setup.sh --env-only

      - name: Package
        run: |
          tar czf "../pybin-${{ matrix.triple }}.tar.gz" \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.uv' \
            .
          mv "../pybin-${{ matrix.triple }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: pybin-${{ matrix.triple }}
          path: pybin-${{ matrix.triple }}.tar.gz

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pybin-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: pybin-*.tar.gz
          draft: true
